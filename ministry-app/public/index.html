<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      JSCI Ministry, the web app (sanctuaryhub.vercel.app/ministrysystem).
      The same app as the Android one, built for the browser. From the iPhone
      Home Screen (Share > Add to Home Screen) it opens full screen.
      Built by ministry-app/scripts/build-web.mjs into web/public/ministrysystem.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>JSCI Ministry</title>
    <meta name="description" content="JSCI Ministry - lineups, songs, lyrics, requests, attendance and group chats for the ministry team of Joyful Sound Church International." />
    <meta name="robots" content="noindex" />

    <!-- Full screen from the Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JSCI Ministry" />
    <meta name="application-name" content="JSCI Ministry" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/ministrysystem/manifest.json" />
    <link rel="apple-touch-icon" href="/ministrysystem/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/ministrysystem/icons/favicon.png" />

    <style id="expo-reset">
      /* The page itself never scrolls or moves sideways: the app's screens
         scroll inside it, and the tab bar stays on the bottom edge. */
      html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
      body {
        position: relative;
        background: #f8f9fa;
        /* An app, not a page: no bounce of the whole page, no grey tap flash,
           no text selection by a long press, no double-tap zoom. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }
      input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
      /* The app is exactly one screen tall, edge to edge (viewport-fit=cover):
           100dvh  the visible height, browser bars left out (fallbacks: 100vh, 100%)
           --app-height  set only on the iPhone Home Screen, by the script below,
                         where the app is the whole screen and 100% / 100dvh can
                         fall short by about the status bar
         The safe areas (status bar, notch / Dynamic Island, home indicator,
         the sides in landscape) are kept clear inside the app with
         env(safe-area-inset-*), read by react-native-safe-area-context. */
      #root {
        display: flex; flex-direction: column;
        position: absolute; top: 0; left: 0; right: 0;
        width: 100%; max-width: 100vw;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) { body { background: #1a1a2e; } }

      /* A computer: the app as a phone-wide column in the middle. */
      @media (min-width: 640px) {
        body { background: #e9ecf1; }
        #root { max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(0, 0, 0, 0.12); }
        #boot { max-width: 480px; margin: 0 auto; }
      }
      @media (min-width: 640px) and (prefers-color-scheme: dark) { body { background: #10101e; } }

      /* Shown until the app has started */
      #boot {
        position: fixed; inset: 0; z-index: 100000;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #f8f9fa; transition: opacity 0.3s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot img { width: 96px; height: 96px; animation: boot-breathe 2.2s ease-in-out infinite; }
      #boot .name { color: #926C15; font-size: 22px; font-weight: 800; letter-spacing: 0.3px; }
      #boot .dots { display: flex; gap: 8px; }
      #boot .dots span { width: 8px; height: 8px; border-radius: 4px; background: #C9980B; opacity: 0.25; animation: boot-dot 1.2s ease-in-out infinite; }
      #boot .dots span:nth-child(2) { animation-delay: 0.18s; }
      #boot .dots span:nth-child(3) { animation-delay: 0.36s; }
      @media (prefers-color-scheme: dark) { #boot { background: #1a1a2e; } #boot .name { color: #FFC300; } }
      @keyframes boot-breathe { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.04); } }
      @keyframes boot-dot { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>

  <body>
    <script>
      (function () {
        var nav = navigator;
        var ios = /iphone|ipad|ipod/i.test(nav.userAgent) || (nav.platform === 'MacIntel' && nav.maxTouchPoints > 1);
        var standalone = nav.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

        // From the iPhone Home Screen the app is the whole screen, whatever the
        // iPhone's size: its height is the screen's (portrait or landscape).
        // Everywhere else the CSS (100dvh) already fits the visible area.
        function fit() {
          if (!(ios && standalone)) return;
          var portrait = window.innerWidth <= window.innerHeight;
          var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          document.documentElement.style.setProperty('--app-height', Math.max(full, window.innerHeight) + 'px');
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });

        // iPhone moves the whole page up to show a field above the keyboard
        // and sometimes leaves it there: put it back when typing ends.
        if (ios) {
          document.addEventListener('focusout', function () {
            setTimeout(function () {
              var el = document.activeElement;
              if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) window.scrollTo(0, 0);
            }, 80);
          });
        }
      })();
    </script>
    <noscript>Turn on JavaScript to use JSCI Ministry.</noscript>
    <div id="boot" aria-label="Loading JSCI Ministry">
      <img src="/ministrysystem/icons/logo.png" alt="" />
      <div class="name">JSCI Ministry</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
  </body>
</html>
